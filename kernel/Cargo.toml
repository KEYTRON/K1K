[package]
name = "k1k"
version = "1.0.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "K1K — K1 Kernel: hybrid capability-based kernel"

[[bin]]
name = "k1k"
path = "src/main.rs"
test = false
bench = false

[dependencies]
limine = "0.6"
x86_64 = { version = "0.15", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
spin = "0.10"
linked_list_allocator = "0.10"

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 2
