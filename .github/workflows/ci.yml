name: K1K CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs on the K1 lab runner (see KEYTRON/K1OS ci/runner): Rust nightly,
# QEMU+KVM, xorriso and mtools are preinstalled there.
jobs:
  build-and-test:
    runs-on: [self-hosted, k1lab, k1k]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          clean: false

      - name: Toolchain
        run: |
          rustup show active-toolchain
          rustup target list --installed | grep -q x86_64-unknown-none

      - name: Check formatting
        run: |
          (cd kernel && cargo fmt --check)
          (cd user && cargo fmt --check)

      - name: Build kernel and services
        run: make kernel

      - name: Boot test in QEMU (4 CPUs, NVMe disk)
        run: make test

      - name: Upload serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serial-log
          path: build/serial.log
